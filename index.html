<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D Galerie exponátů</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BF%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Obrazovka galerie -->
      <section id="gallery-screen" class="screen">
        <header class="gallery-header">
          <h1>3D Galerie exponátů</h1>
          <p class="subtitle">Vyberte exponát dotykem a prohlédněte si jej ze všech stran</p>
        </header>
        <div id="gallery-grid" class="gallery-grid"></div>
      </section>

      <!-- Obrazovka prohlížeče modelu -->
      <section id="viewer-screen" class="screen hidden">
        <div id="viewer-canvas-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <div id="loading-text">Načítání modelu…</div>
            <div class="progress-track"><div id="loading-progress" class="progress-fill"></div></div>
          </div>
        </div>

        <button id="btn-back" class="btn btn-round btn-back" aria-label="Zpět na přehled">←</button>

        <div class="bottom-left-controls">
          <div id="light-modes" class="light-modes">
            <button class="light-btn" data-mode="studio" aria-label="Standardní osvětlení">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2.2M19.8 12H22M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5" />
              </svg>
            </button>
            <button class="light-btn" data-mode="side" aria-label="Boční světlo – zvýrazní detaily povrchu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M4.2 4.2l1.5 1.5M2 12h2.2M4.2 19.8l1.5-1.5" />
              </svg>
            </button>
            <button class="light-btn" data-mode="top" aria-label="Reflektor shora">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3h6l2 7H7z" />
                <path d="M8 21h8M10 17l-1 4M14 17l1 4" />
              </svg>
            </button>
            <button class="light-btn" data-mode="flat" aria-label="Rovnoměrné osvětlení bez stínů">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <circle cx="12" cy="12" r="3" />
                <circle cx="12" cy="4" r="1.4" />
                <circle cx="12" cy="20" r="1.4" />
                <circle cx="4" cy="12" r="1.4" />
                <circle cx="20" cy="12" r="1.4" />
              </svg>
            </button>
          </div>
          <button id="btn-reset" class="btn btn-round btn-reset" aria-label="Resetovat pohled">⟳</button>
        </div>

        <div id="viewer-title" class="viewer-title"></div>

        <div id="hint" class="hint">Prstem otočíte model, dvěma prsty přiblížíte</div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
